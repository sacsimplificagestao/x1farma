<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="robots" content="noindex,nofollow" />
<title>Conectando ao atendimento</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --black:#0A0A0A;
    --black-2:#111111;
    --gold:#E0B04A;
    --orange:#F4A11E;
    --green:#63D36B;
    --green-2:#4ec457;
    --green-glow:rgba(99,211,107,.35);
    --ice:#F7F7F7;
    --muted:rgba(247,247,247,.62);
    --hair:rgba(247,247,247,.08);
    --hair-strong:rgba(247,247,247,.14);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    background:var(--black);color:var(--ice);
    font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;
    overflow:hidden;
    min-height:100vh;min-height:100dvh;
  }
  body{font-size:16px;line-height:1.5}
  a{color:inherit;text-decoration:none}

  /* ---------- Atmosphere ---------- */
  .atmos{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .atmos .grid{
    position:absolute;inset:-1px;
    background-image:
      linear-gradient(rgba(224,176,74,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(224,176,74,.04) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse at 50% 50%,#000 0%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 0%,transparent 75%);
  }
  .atmos .glow-top{
    position:absolute;top:-200px;left:50%;transform:translateX(-50%);
    width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle,rgba(224,176,74,.15),transparent 60%);
    filter:blur(50px);
  }
  .atmos .glow-bottom{
    position:absolute;bottom:-150px;left:50%;transform:translateX(-50%);
    width:600px;height:400px;border-radius:50%;
    background:radial-gradient(circle,rgba(99,211,107,.25),transparent 60%);
    filter:blur(60px);
    animation:pulse-glow 4s ease-in-out infinite;
  }
  @keyframes pulse-glow{
    0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}
    50%{opacity:1;transform:translateX(-50%) scale(1.08)}
  }

  /* Molecules float */
  .mol{position:absolute;opacity:.35}
  .mol-1{top:12%;right:-40px;width:140px;animation:float 18s ease-in-out infinite}
  .mol-2{bottom:18%;left:-50px;width:130px;animation:float 22s ease-in-out infinite reverse}
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-16px) rotate(8deg)}
  }

  /* Particles (very subtle) */
  .particle{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 8px var(--gold);
    opacity:.4;
  }
  .particle:nth-child(1){top:20%;left:15%;animation:drift 8s ease-in-out infinite}
  .particle:nth-child(2){top:35%;right:20%;animation:drift 10s ease-in-out infinite reverse}
  .particle:nth-child(3){bottom:25%;left:25%;animation:drift 12s ease-in-out infinite}
  .particle:nth-child(4){bottom:40%;right:30%;background:var(--green);box-shadow:0 0 8px var(--green);animation:drift 9s ease-in-out infinite reverse}
  .particle:nth-child(5){top:50%;left:8%;background:var(--green);box-shadow:0 0 8px var(--green);animation:drift 11s ease-in-out infinite}
  @keyframes drift{
    0%,100%{transform:translate(0,0);opacity:.4}
    50%{transform:translate(20px,-15px);opacity:.8}
  }

  /* ---------- Layout ---------- */
  .stage{
    position:relative;z-index:2;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    padding:24px 22px;
  }

  /* ---------- Top: status line ---------- */
  .status{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);
    padding-top:8px;
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);box-shadow:0 0 12px var(--green-glow);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

  /* ---------- Center: hero ---------- */
  .center{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:40px 0;
  }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold);margin-bottom:28px;
    display:inline-flex;align-items:center;gap:12px;
    opacity:0;animation:fadeIn .8s .1s ease-out forwards;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";width:32px;height:1px;background:var(--gold);
    display:inline-block;opacity:.6;
  }

  h1{
    font-family:'Fraunces',serif;font-weight:400;
    font-size:clamp(32px,8vw,56px);
    line-height:1.02;letter-spacing:-.025em;
    margin-bottom:18px;max-width:680px;
    opacity:0;animation:fadeIn .8s .25s ease-out forwards;
  }
  h1 em{
    font-style:italic;
    background:linear-gradient(120deg,var(--green) 0%,#8be58f 60%,var(--green) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px var(--green-glow);
  }

  .sub{
    font-size:clamp(15px,4vw,17px);
    color:var(--muted);max-width:440px;
    margin-bottom:48px;line-height:1.55;
    opacity:0;animation:fadeIn .8s .4s ease-out forwards;
  }

  @keyframes fadeIn{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ---------- WA Button (the star) ---------- */
  .wa-wrap{
    position:relative;
    opacity:0;animation:fadeIn 1s .55s ease-out forwards;
  }
  .wa-wrap::before{
    content:"";position:absolute;
    inset:-30px;
    background:radial-gradient(ellipse at center,rgba(99,211,107,.35),transparent 70%);
    filter:blur(30px);
    z-index:-1;
    animation:breathe 3s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.7;transform:scale(1)}
    50%{opacity:1;transform:scale(1.08)}
  }

  .wa-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:14px;
    min-width:300px;max-width:90vw;
    background:linear-gradient(135deg,#5ec866 0%,var(--green) 50%,var(--green-2) 100%);
    color:#062a09;font-weight:800;font-size:17px;
    letter-spacing:.01em;text-transform:uppercase;
    padding:24px 36px;border-radius:18px;
    box-shadow:
      0 22px 60px -12px rgba(99,211,107,.6),
      0 0 0 1px rgba(99,211,107,.4),
      inset 0 1px 0 rgba(255,255,255,.4);
    position:relative;overflow:hidden;
    transition:transform .2s ease,box-shadow .3s ease;
    cursor:pointer;border:0;font-family:inherit;
  }
  .wa-btn:hover{
    transform:translateY(-2px);
    box-shadow:
      0 28px 70px -10px rgba(99,211,107,.7),
      0 0 0 1px rgba(99,211,107,.5),
      inset 0 1px 0 rgba(255,255,255,.4);
  }
  .wa-btn:active{transform:translateY(0) scale(.98)}
  .wa-btn svg{width:24px;height:24px;flex-shrink:0}
  .wa-btn::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);
    transform:translateX(-100%);
    pointer-events:none;
  }
  .wa-btn:hover::after{transform:translateX(100%);transition:transform 1s ease}

  /* Loading state when clicked */
  .wa-btn.loading{
    pointer-events:none;
    background:linear-gradient(135deg,var(--green-2),var(--green));
  }
  .wa-btn.loading .wa-label{opacity:0}
  .wa-btn.loading .wa-icon{opacity:0}
  .wa-btn.loading::before{
    content:"";position:absolute;left:50%;top:50%;
    width:24px;height:24px;
    border:3px solid rgba(6,42,9,.2);border-top-color:#062a09;
    border-radius:50%;
    transform:translate(-50%,-50%);
    animation:spin .6s linear infinite;
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  /* ---------- Below button: meta info ---------- */
  .meta{
    margin-top:32px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:10px;
    opacity:0;animation:fadeIn .8s .7s ease-out forwards;
  }
  .meta .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--green);box-shadow:0 0 10px var(--green-glow);
    animation:pulse 2s ease-in-out infinite;
  }

  .helper{
    margin-top:16px;
    font-size:12px;color:var(--muted);opacity:0;
    animation:fadeIn .8s .85s ease-out forwards;
  }
  .helper a{
    color:var(--gold);text-decoration:underline;
    text-decoration-color:rgba(224,176,74,.3);
    text-underline-offset:3px;
  }

  /* ---------- Bottom: signature line ---------- */
  .signature{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);opacity:.6;
    padding-top:24px;
    opacity:0;animation:fadeIn .8s 1s ease-out forwards;
  }
  .signature .sep{margin:0 8px;opacity:.5}

  /* Tablet+ */
  @media (min-width:760px){
    .stage{padding:32px 36px}
    .wa-btn{padding:28px 48px;font-size:18px;min-width:360px}
    .wa-btn svg{width:26px;height:26px}
  }

  /* Reduce motion */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
    }
  }
</style>
</head>
<body>

<!-- Atmosphere -->
<div class="atmos" aria-hidden="true">
  <div class="grid"></div>
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <svg class="mol mol-1" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#E0B04A" stroke-width="1" opacity=".7">
      <line x1="40" y1="60" x2="100" y2="40"/>
      <line x1="100" y1="40" x2="160" y2="70"/>
      <line x1="100" y1="40" x2="100" y2="110"/>
      <line x1="100" y1="110" x2="50" y2="150"/>
      <line x1="100" y1="110" x2="155" y2="150"/>
    </g>
    <g fill="#E0B04A">
      <circle cx="40" cy="60" r="4"/><circle cx="100" cy="40" r="5"/>
      <circle cx="160" cy="70" r="4"/><circle cx="100" cy="110" r="5"/>
      <circle cx="50" cy="150" r="4"/><circle cx="155" cy="150" r="4"/>
    </g>
  </svg>

  <svg class="mol mol-2" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#63D36B" stroke-width="1" opacity=".6">
      <line x1="60" y1="80" x2="120" y2="50"/>
      <line x1="120" y1="50" x2="160" y2="100"/>
      <line x1="120" y1="50" x2="100" y2="130"/>
      <line x1="100" y1="130" x2="40" y2="140"/>
      <line x1="100" y1="130" x2="150" y2="170"/>
    </g>
    <g fill="#63D36B">
      <circle cx="60" cy="80" r="4"/><circle cx="120" cy="50" r="5"/>
      <circle cx="160" cy="100" r="4"/><circle cx="100" cy="130" r="5"/>
      <circle cx="40" cy="140" r="4"/><circle cx="150" cy="170" r="4"/>
    </g>
  </svg>
</div>

<main class="stage">

  <!-- Top status line -->
  <div class="status">
    <span class="dot"></span>
    <span>Canal direto · Atendimento ativo</span>
  </div>

  <!-- Center hero -->
  <div class="center">
    <div class="eyebrow">Canal seguro</div>

    <h1>Toque abaixo para falar com <em>nossa equipe</em>.</h1>

    <p class="sub">
      Atendimento individual e direto. Sem intermediários, sem espera.
    </p>

    <div class="wa-wrap">
      <button class="wa-btn" id="waBtn" type="button" aria-label="Abrir WhatsApp">
        <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0020.465 3.488"/>
        </svg>
        <span class="wa-label">Chamar no WhatsApp</span>
      </button>
    </div>

    <div class="meta">
      <span class="dot"></span>
      <span>Equipe online · resposta imediata</span>
    </div>

    <p class="helper" id="helperText" hidden>
      Não abriu automaticamente? <a href="#" id="manualLink">Clique aqui</a>.
    </p>
  </div>

  <!-- Bottom signature -->
  <div class="signature">
    <span>SSL</span><span class="sep">·</span>
    <span>Conexão segura</span><span class="sep">·</span>
    <span id="yearSpan"></span>
  </div>

</main>

<script>
  // ============================================
  // CONFIGURAÇÃO DO WHATSAPP
  // Quando o número cair, troca AQUI e dá deploy.
  // Formato: DDI + DDD + número (sem espaços, sem símbolos)
  // Exemplo Brasil: 5573999999999
  // ============================================
  const WA_NUMBER = '5511987746374';

  // Mensagem padrão que vai pré-preenchida no WhatsApp
  const DEFAULT_MSG = 'Olá! Quero falar com um especialista.';

  // ============================================
  // Não precisa mexer daqui pra baixo
  // ============================================

  document.getElementById('yearSpan').textContent = new Date().getFullYear();

  function buildWaUrl() {
    if (!WA_NUMBER) return null;

    // Preserva UTMs vindas da URL (?utm_source=story&utm_campaign=xyz)
    // pra você rastrear de onde veio o lead na mensagem do WhatsApp
    const urlParams = new URLSearchParams(window.location.search);
    const utmSource   = urlParams.get('utm_source');
    const utmCampaign = urlParams.get('utm_campaign');
    const utmContent  = urlParams.get('utm_content');

    let msg = DEFAULT_MSG;
    const utmTags = [];
    if (utmSource)   utmTags.push(`origem:${utmSource}`);
    if (utmCampaign) utmTags.push(`campanha:${utmCampaign}`);
    if (utmContent)  utmTags.push(`anuncio:${utmContent}`);

    if (utmTags.length > 0) {
      msg += `\n\n[${utmTags.join(' · ')}]`;
    }

    return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  }

  const waBtn      = document.getElementById('waBtn');
  const helper     = document.getElementById('helperText');
  const manualLink = document.getElementById('manualLink');

  waBtn.addEventListener('click', () => {
    const url = buildWaUrl();
    if (!url) {
      alert('Atendimento indisponível no momento. Tente novamente em instantes.');
      return;
    }

    // Loading state pra dar feedback visual
    waBtn.classList.add('loading');

    // Abre o WhatsApp (mesma aba pra evitar bloqueio de popup)
    setTimeout(() => {
      window.location.href = url;

      // Se em 1.5s a janela ainda tá visível, mostra fallback manual
      setTimeout(() => {
        if (!document.hidden) {
          waBtn.classList.remove('loading');
          manualLink.href = url;
          helper.hidden = false;
        }
      }, 1500);
    }, 350);
  });
</script>

</body>
</html>
